name: 缺陷
description: 网站的显示或行为与预期不符
title: '【缺陷】范围：'
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        标题格式：`【缺陷】范围：详细描述`，范围写页面或部分，例如“首页”“关于页”“Wakarito 页”“全站”“部署”。写到半年后只看标题也能想起是什么事。
        选填项没有内容时写“无（原因）”。
  - type: textarea
    id: summary
    attributes:
      label: 现象概要
      description: 一两句话说明哪里不对。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 地址与环境
      description: 出问题的完整网址（生产或预览地址）、浏览器和版本、电脑或手机。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 https://koukenhou.com/...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 截图、浏览器控制台报错或 Cloudflare 构建日志片段。
      value: 无（尚未收集）
  - type: textarea
    id: root-cause
    attributes:
      label: 调查结论与做法
      description: 根本原因、判断依据和计划的修法。
      value: 待调查
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 做到什么程度算完成；PR 的用户验收清单从这里生成。
      value: |
        - [ ]
    validations:
      required: true
